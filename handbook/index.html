<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会务手册 / Conference Handbook</title>
    <!-- PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #5a5a5a;
            min-height: 100vh;
        }
        /* 加载状态 */
        .load-status {
            text-align: center;
            padding: 40px 16px;
            color: #fff;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .retry-btn {
            margin-top: 14px;
            padding: 10px 24px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        /* PDF 连续滚动容器 */
        .pdf-container {
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #5a5a5a;
            padding: 8px 0 40px;
        }
        .pdf-page {
            display: block;
            margin: 0 auto 8px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            max-width: 100%;
        }
        /* 页码指示器 */
        .page-indicator {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .page-indicator.show {
            opacity: 1;
        }
        /* 错误状态 */
        .error-status {
            text-align: center;
            padding: 40px 16px;
            color: #fff;
            font-size: 14px;
            background: linear-gradient(135deg, #c62828 0%, #7b1818 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            padding: 10px 16px 16px;
            line-height: 1.8;
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <!-- 加载状态 -->
    <div id="loadStatus" class="load-status">
        <div class="spinner"></div>
        <div>正在加载会务手册...</div>
        <div style="margin-top:6px;font-size:12px;opacity:0.7;">Loading handbook...</div>
    </div>

    <!-- 错误状态（初始隐藏） -->
    <div id="errorStatus" class="error-status" style="display:none;">
        <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
        <div style="font-size:16px;font-weight:600;">手册加载失败</div>
        <div id="errorMsg" style="margin-top:8px;font-size:12px;opacity:0.85;"></div>
        <button class="retry-btn" onclick="loadPdf()">🔄 重新加载</button>
    </div>

    <!-- PDF 连续滚动容器 -->
    <div id="pdfContainer" class="pdf-container" style="display:none;"></div>

    <!-- 页码指示器 -->
    <div id="pageIndicator" class="page-indicator"></div>

    <!-- 底部信息 -->
    <div id="footer" class="footer" style="display:none;">
        <div>技术支持：广州海洋地质调查局三亚南海地质研究所</div>
        <div style="opacity:0.7;margin-top:2px;">Developed by：Sanya South China Sea Geological Research Institute, Guangzhou Marine Geological Survey</div>
    </div>

    <script>
        const PDF_FILE = '大会手册.pdf';
        let pdfDoc = null;
        let totalPages = 0;
        let scale = 1.5;  // 适合手机屏幕的默认缩放
        let renderedPages = new Set();  // 已渲染的页
        let pageElements = [];  // 每页的 canvas 元素
        let scrollTimer = null;

        // 配置 PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

        // 加载 PDF
        async function loadPdf() {
            const loadStatus = document.getElementById('loadStatus');
            const errorStatus = document.getElementById('errorStatus');
            const pdfContainer = document.getElementById('pdfContainer');
            const footer = document.getElementById('footer');

            // 重置 UI
            loadStatus.style.display = 'flex';
            errorStatus.style.display = 'none';
            pdfContainer.style.display = 'none';
            pdfContainer.innerHTML = '';
            footer.style.display = 'none';
            renderedPages.clear();
            pageElements = [];

            try {
                const loadingTask = pdfjsLib.getDocument(PDF_FILE);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;

                // 计算适合屏幕的缩放比例
                const screenWidth = window.innerWidth;
                // 先获取第一页的原始尺寸，根据屏幕宽度自适应缩放
                const firstPage = await pdfDoc.getPage(1);
                const baseViewport = firstPage.getViewport({ scale: 1 });
                scale = (screenWidth * 0.96) / baseViewport.width;
                // 限制最小 0.8、最大 3.0
                scale = Math.max(0.8, Math.min(scale, 3.0));

                // 加载成功，显示容器
                loadStatus.style.display = 'none';
                pdfContainer.style.display = 'block';
                footer.style.display = 'block';

                // 为每一页创建 canvas 占位
                for (let i = 1; i <= totalPages; i++) {
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    canvas.id = 'page-' + i;
                    canvas.dataset.pageNum = i;
                    // 设置最小高度避免滚动条跳动
                    canvas.style.minHeight = '400px';
                    pdfContainer.appendChild(canvas);
                    pageElements.push(canvas);
                }

                // 首屏渲染（先渲染前 2 页）
                await renderVisiblePages();

                // 监听滚动，渲染可见页面
                pdfContainer.addEventListener('scroll', onScroll);

            } catch (err) {
                console.error(err);
                loadStatus.style.display = 'none';
                errorStatus.style.display = 'flex';
                document.getElementById('errorMsg').textContent =
                    err.message + '（请确保 index.html 和 ' + PDF_FILE + ' 在同一目录，且通过 HTTP 服务器访问）';
            }
        }

        // 渲染可见页面（懒加载）
        async function renderVisiblePages() {
            if (!pdfDoc) return;
            const container = document.getElementById('pdfContainer');
            const containerRect = container.getBoundingClientRect();
            const viewTop = container.scrollTop - 200;  // 提前 200px 渲染
            const viewBottom = container.scrollTop + containerRect.height + 200;

            for (let i = 0; i < pageElements.length; i++) {
                const canvas = pageElements[i];
                const pageNum = parseInt(canvas.dataset.pageNum);

                if (renderedPages.has(pageNum)) continue;

                const canvasTop = canvas.offsetTop;
                const canvasBottom = canvasTop + canvas.offsetHeight;

                // 判断是否在可视范围内
                if (canvasBottom >= viewTop && canvasTop <= viewBottom) {
                    renderedPages.add(pageNum);
                    renderPage(pageNum, canvas);
                }
            }
        }

        // 渲染单页
        async function renderPage(pageNum, canvas) {
            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: scale });

                // 清除最小高度
                canvas.style.minHeight = '';
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const ctx = canvas.getContext('2d');
                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;
            } catch (err) {
                console.error('渲染第 ' + pageNum + ' 页失败:', err);
            }
        }

        // 滚动事件（节流 + 显示当前页码）
        function onScroll() {
            const container = document.getElementById('pdfContainer');
            const indicator = document.getElementById('pageIndicator');

            // 节流渲染
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(renderVisiblePages, 150);

            // 计算当前页码
            const scrollTop = container.scrollTop;
            const containerHeight = container.clientHeight;
            const scrollMid = scrollTop + containerHeight / 2;

            let currentPageNum = 1;
            for (let i = 0; i < pageElements.length; i++) {
                const canvas = pageElements[i];
                if (canvas.offsetTop <= scrollMid) {
                    currentPageNum = parseInt(canvas.dataset.pageNum);
                } else {
                    break;
                }
            }

            indicator.textContent = currentPageNum + ' / ' + totalPages;
            indicator.classList.add('show');

            // 停止滚动后 1.5 秒隐藏
            clearTimeout(window.hideIndicatorTimer);
            window.hideIndicatorTimer = setTimeout(() => {
                indicator.classList.remove('show');
            }, 1500);
        }

        // 启动
        loadPdf();
    </script>
</body>
</html>
